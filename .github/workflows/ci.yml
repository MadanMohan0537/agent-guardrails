name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest --cov=agent_guardrails --cov-report=term-missing
      - name: Evaluation gate
        run: sentinel-eval run datasets/product_support.jsonl --mutations --min-pass-rate 0.80
      - name: Release gate accepts the good fixture
        run: releaseproof examples/baseline.json examples/candidate-good.json --policy examples/policy.json --report reports/good.json --html reports/good.html
      - name: Release gate blocks the bad fixture
        shell: bash
        run: |
          set +e
          releaseproof examples/baseline.json examples/candidate-bad.json --policy examples/policy.json --report reports/bad.json --html reports/bad.html
          status=$?
          set -e
          test "$status" -eq 1
      - name: Provenance demo
        run: python examples/provenance_demo.py
      - name: End-to-end demo
        run: agent-guardrails demo --output artifacts/demo-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-py${{ matrix.python-version }}
          path: |
            artifacts/
            reports/
