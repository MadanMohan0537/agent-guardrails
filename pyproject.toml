[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-guardrails"
version = "0.1.0"
description = "Evaluate agent behavior, enforce least-privilege tool calls, and block bad releases."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Madan Mohan"}]
keywords = ["ai", "agents", "guardrails", "evaluation", "authorization"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[project.scripts]
agent-guardrails = "agent_guardrails.cli:main"
sentinel-eval = "agent_guardrails.evaluate.cli:main"
scopelock = "agent_guardrails.enforce.cli:main"
releaseproof = "agent_guardrails.release.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guardrails"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "worker"]

[tool.ruff.lint]
# E/F match the original evaluation-harness gate. Import order is included.
# TRY and FURB are off: the release gate's public contract raises ValueError,
# including for values of the wrong type, and the tests assert that.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_guardrails"]

[tool.coverage.run]
source = ["agent_guardrails"]
branch = true
